<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ルート案内＆評価ポイントお知らせ</title>
  <link rel="stylesheet" href="leaflet.css">
  <style>
    #map { height: 100vh; width: 100%; }
    .control-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="control-panel">
    <button onclick="startTracking()">追跡開始</button>
    <button onclick="stopTracking()">追跡停止</button>
  </div>

  <script src="leaflet.js"></script>
  <script src="togeojson.umd.js"></script>
  <script src="jszip.min.js"></script>

  <script>
    let map = L.map('map').setView([35.3, 139.17], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    let watchId = null;
    let points = [];  // {lat, lng, name, notifiedFar, notifiedNear}

    // 🔊 読み上げ関数
    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ja-JP";
      utter.rate = 1.0;
      speechSynthesis.speak(utter);
    }

    // 📐 ナビ風メッセージ生成
    function createNaviMessage(name, distance) {
      let action = "";
      if (name.includes("左")) action = "左折";
      else if (name.includes("右")) action = "右折";
      else if (name.includes("直進")) action = "直進";
      else action = "進みます";

      if (distance > 100) {
        return `${Math.round(distance)}メートル先、${name.replace(/を[左右直進].*$/, "")}を${action}です`;
      } else {
        return `まもなく、${name.replace(/を[左右直進].*$/, "")}を${action}です`;
      }
    }

    // 📍 距離チェック
    function checkProximity(currentLat, currentLng, target) {
      let currentLatLng = L.latLng(currentLat, currentLng);
      let targetLatLng = L.latLng(target.lat, target.lng);
      let distance = currentLatLng.distanceTo(targetLatLng);

      // 300m以内
      if (distance < 300 && distance > 80 && !target.notifiedFar) {
        let message = createNaviMessage(target.name, distance);
        speak(message);
        target.notifiedFar = true;
      }

      // 80m以内
      if (distance <= 80 && !target.notifiedNear) {
        let message = createNaviMessage(target.name, distance);
        speak(message);
        target.notifiedNear = true;
      }
    }

    // 🚗 追跡開始
    function startTracking() {
      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition((pos) => {
          let lat = pos.coords.latitude;
          let lng = pos.coords.longitude;

          // 自車位置を表示
          L.circleMarker([lat, lng], {radius: 6, color: 'red'}).addTo(map);
          map.setView([lat, lng], 16);

          // 各ポイントをチェック
          points.forEach(p => checkProximity(lat, lng, p));
        });
      } else {
        alert("GPSが利用できません");
      }
    }

    // ⏹️ 追跡停止
    function stopTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    }

    // 🗂️ サンプルポイント（本来はKMZ/KMLから読み込み）
    points = [
      {lat: 35.2897915, lng: 139.1787426, name: "たこ焼きまえ交差点を左", notifiedFar: false, notifiedNear: false},
      {lat: 35.347874, lng: 139.2169363, name: "おはかまえのT字路を右", notifiedFar: false, notifiedNear: false},
      {lat: 35.3381013, lng: 139.2298993, name: "中井電話きょく交差点を左", notifiedFar: false, notifiedNear: false},
    ];

    // 地図上にポイントを表示
    points.forEach(p => {
      L.marker([p.lat, p.lng]).addTo(map).bindPopup(p.name);
    });
  </script>
</body>
</html>
