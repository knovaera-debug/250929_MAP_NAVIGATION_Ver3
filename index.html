<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>実車評価支援ツール</title>
<link rel="stylesheet" href="leaflet.css" />
<script src="leaflet.js"></script>
<script src="jszip.min.js"></script>
<script src="togeojson.umd.js"></script>
<style>
  html,body{height:100%;margin:0}
  #map{position:fixed; inset:0; background:#f2f2f2;}
  #panel{
    position:fixed; left:10px; top:calc(10px + env(safe-area-inset-top));
    z-index:2147483000; background:#fff; padding:10px 12px; border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    min-width:300px; max-width:min(94vw,560px);
  }
  h1{margin:0 0 8px;font-size:15px;font-weight:700}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  button{padding:10px 14px; min-height:40px; border-radius:12px; cursor:pointer; border:1px solid #ddd; background:#fff;}
  #start{background:#16a34a;color:#fff;border-color:#16a34a}
  #recenter{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
  #cp{background:#f59e0b;color:#fff;border-color:#f59e0b}
  #toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    z-index:2147483100; display:none; background:rgba(0,0,0,.85); color:#fff;
    padding:10px 14px; border-radius:12px; font-size:14px}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>実車評価支援ツール</h1>

  <!-- ✅ GitHubルート選択 -->
  <div class="row">
    <label for="githubSelect">GitHubルート選択:</label>
    <select id="githubSelect" class="grow">
      <option value="">（選択してください）</option>
      <option value="https://raw.githubusercontent.com/knovaera-debug/250929_MAP_NAVIGATION_Ver3/main/data/Final_国内DPコース評価ポイント付き_251007_v10.kmz">
        Final_国内DPコース評価ポイント付き_251007_v10.kmz
      </option>
      <option value="https://raw.githubusercontent.com/knovaera-debug/250929_MAP_NAVIGATION_Ver3/main/data/ルートTest.kmz">
        ルートTest.kmz
      </option>
    </select>
  </div>

  <div class="row">
    <button id="start">追跡開始</button>
    <button id="recenter">現在地へ</button>
    <button id="cp" disabled>チェックポイント</button>
  </div>

  <div class="row">
    <label><input type="checkbox" id="keepCentered" checked />自車を常に中心</label>
  </div>
</div>

<div id="toast"></div>

<script>
// ==================== 地図の初期化 ====================
const map = L.map('map').setView([35.68, 139.76], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

let userMarker = null;
let routeLayer = null;
let watchId = null;

// ==================== トースト表示 ====================
function showToast(msg, duration = 2500) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", duration);
}

// ==================== GitHubからKMZを読み込む ====================
document.getElementById("githubSelect").addEventListener("change", async function() {
  const url = this.value;
  if (!url) return;
  showToast("ルートを読み込み中...");

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("ファイルを取得できませんでした");
    const blob = await res.blob();

    const zip = new JSZip();
    const loaded = await zip.loadAsync(blob);
    const kmlFile = Object.keys(loaded.files).find(f => f.endsWith(".kml"));
    if (!kmlFile) throw new Error("KMLファイルが見つかりません");

    const kmlText = await loaded.files[kmlFile].async("string");
    const parser = new DOMParser();
    const kmlDoc = parser.parseFromString(kmlText, "text/xml");
    const geojson = toGeoJSON.kml(kmlDoc);

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(geojson, {
      color: "orange",
      weight: 4
    }).addTo(map);

    map.fitBounds(routeLayer.getBounds());
    showToast("✅ ルート読込完了: " + url.split("/").pop());
  } catch (err) {
    console.error(err);
    showToast("❌ KMZ読込エラー: " + err.message);
  }
});

// ==================== 現在地追跡 ====================
document.getElementById("start").addEventListener("click", () => {
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    showToast("追跡停止しました");
    return;
  }
  showToast("追跡開始しました");
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      if (!userMarker) {
        userMarker = L.circleMarker([lat, lon], {
          radius: 8, color: "red", fillColor: "#f03", fillOpacity: 0.9
        }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lon]);
      }
      if (document.getElementById("keepCentered").checked) {
        map.setView([lat, lon]);
      }
    },
    (err) => {
      showToast("GPS取得エラー: " + err.message);
    },
    { enableHighAccuracy: true }
  );
});

// ==================== 現在地へ移動 ====================
document.getElementById("recenter").addEventListener("click", () => {
  if (userMarker) {
    map.setView(userMarker.getLatLng(), 17);
    showToast("現在地へ移動しました");
  } else {
    showToast("まだ位置情報が取得されていません");
  }
});
</script>
</body>
</html>
