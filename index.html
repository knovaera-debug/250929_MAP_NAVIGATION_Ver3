<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>実車評価支援ツール</title>

<!-- Leaflet -->
<link rel="stylesheet" href="leaflet.css" />
<script src="leaflet.js"></script>

<!-- togeojson & jszip -->
<script src="togeojson.umd.js"></script>
<script src="jszip.min.js"></script>

<style>
  html,body{height:100%;margin:0}
  #map{position:fixed; inset:0; background:#f2f2f2;}
  #panel{
    position:fixed; left:10px; top:calc(10px + env(safe-area-inset-top));
    z-index:1000; background:#fff; padding:10px 12px; border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    min-width:300px; max-width:min(94vw,560px);
  }
  #panel h1{margin:0 0 8px;font-size:15px;font-weight:700}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  button{padding:10px 14px; min-height:40px; border-radius:12px; cursor:pointer; border:1px solid #ddd;}
  #start{background:#16a34a;color:#fff;border-color:#16a34a}
  #recenter{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
  #cp{background:#f59e0b;color:#fff;border-color:#f59e0b}
  .counts{font-size:11px;color:#334155;background:#f1f5f9;border-radius:9999px;padding:2px 8px}
  #toast{position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:2000; display:none; max-width:min(92vw,560px); background:rgba(0,0,0,.85); color:#fff;
    padding:10px 14px; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.35); font-size:14px}
</style>
</head>
<body>
<div id="map"></div>

<!-- 操作パネル -->
<div id="panel">
  <h1>実車評価支援ツール</h1>

  <div class="row">
    <label for="datasetSelect">評価コース：</label>
    <select id="datasetSelect" class="grow">
      <option value="" disabled selected>（コースを選択）</option>
    </select>
  </div>

  <div class="row">
    <button id="start">追跡開始</button>
    <button id="recenter">現在地へ</button>
    <button id="cp" disabled>チェックポイント</button>
    <span id="counts" class="counts"></span>
  </div>

  <div class="row">
    <label><input type="checkbox" id="keepCentered" checked />自車を常に中心</label>
    <label style="margin-left:10px">向き:</label>
    <label><input type="radio" name="orient" value="north" checked />北を上</label>
    <label><input type="radio" name="orient" value="course" />進行方向を上</label>
  </div>
</div>

<div id="toast"></div>

<script>
/* -------------------------------
   地図初期化
--------------------------------*/
const map = L.map('map', { zoomControl: true }).setView([35.45, 139.39], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let trackMarker = null;
let routeLayer = null;
let pointLayer = null;
let watchId = null;
let keepCentered = true;

/* -------------------------------
   KML/KMZ 読込処理
--------------------------------*/
async function handleKMZFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'kmz') {
    const zip = await JSZip.loadAsync(file);
    const kmlFile = Object.keys(zip.files).find(f => f.endsWith('.kml'));
    if (!kmlFile) throw new Error('KMLが含まれていません');
    const kmlText = await zip.files[kmlFile].async('text');
    loadKMLString(kmlText, file.name);
  } else if (ext === 'kml') {
    const text = await file.text();
    loadKMLString(text, file.name);
  } else {
    alert('KML/KMZファイルを選択してください');
  }
}

function loadKMLString(kmlText, name) {
  const parser = new DOMParser();
  const kmlDom = parser.parseFromString(kmlText, 'text/xml');
  const geojson = toGeoJSON.kml(kmlDom);

  if (routeLayer) map.removeLayer(routeLayer);
  if (pointLayer) map.removeLayer(pointLayer);

  routeLayer = L.geoJSON(geojson, {
    style: { color: '#0ea5e9', weight: 4 }
  }).addTo(map);

  pointLayer = L.geoJSON(geojson, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      radius: 6, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.9
    }).bindPopup(f.properties.name || '(名称なし)')
  }).addTo(map);

  map.fitBounds(routeLayer.getBounds());
  showToast(`✅ コース読込完了: ${name}`);
}

/* -------------------------------
   現在地追跡
--------------------------------*/
function startTracking() {
  if (watchId) return;
  if (!navigator.geolocation) {
    alert('GPS未対応ブラウザです');
    return;
  }

  showToast('📡 追跡を開始しました');
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const latlng = [lat, lng];

      if (!trackMarker) {
        trackMarker = L.marker(latlng).addTo(map);
      } else {
        trackMarker.setLatLng(latlng);
      }

      if (keepCentered) map.setView(latlng);
    },
    (err) => {
      alert('位置情報エラー: ' + err.message);
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
}

document.getElementById('start').addEventListener('click', startTracking);
document.getElementById('recenter').addEventListener('click', () => {
  if (trackMarker) map.setView(trackMarker.getLatLng());
});
document.getElementById('keepCentered').addEventListener('change', e => keepCentered = e.target.checked);

/* -------------------------------
   トースト表示
--------------------------------*/
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
}

/* -------------------------------
   KMZリスト自動読込
--------------------------------*/
const dataPath = 'data/';
const selectEl = document.getElementById('datasetSelect');

async function listKMZFiles() {
  try {
    // filelist.jsonからKMZリストを取得
    const files = await fetch(`${dataPath}filelist.json`).then(r => r.json());

    selectEl.innerHTML = '<option value="" disabled selected>（コースを選択）</option>';
    files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f.replace('.kmz', '');
      selectEl.appendChild(opt);
    });

    // 選択時の読込処理
    selectEl.addEventListener('change', () => {
      const fileName = selectEl.value;
      loadKMZ(fileName);
    });
  } catch (err) {
    console.error('KMZリスト取得エラー:', err);
  }
}

async function loadKMZ(filename) {
  const fileUrl = `${dataPath}${filename}`;
  try {
    const res = await fetch(fileUrl);
    const blob = await res.blob();
    const file = new File([blob], filename);
    await handleKMZFile(file);
  } catch (err) {
    showToast('KMZ読込エラー: ' + err.message);
  }
}

// 起動時にKMZリストを読込
window.addEventListener('DOMContentLoaded', listKMZFiles);
</script>
</body>
</html>
