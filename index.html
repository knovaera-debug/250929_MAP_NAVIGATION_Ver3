<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実車評価支援ツール</title>

<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<script src="jszip.min.js"></script>
<script src="togeojson.umd.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { width: 100%; height: 100%; }

  #menu {
    position: absolute; top: 10px; left: 10px;
    background: rgba(255, 255, 255, 0.95);
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 9999;
  }

  button {
    margin-top: 5px; padding: 8px 12px;
    border: none; border-radius: 8px; cursor: pointer;
  }
  #startBtn { background-color: #0078D7; color: white; }
  #voiceTestBtn { background-color: #00B050; color: white; }
  #closeMenuBtn { background-color: #888; color: white; }
  #status { font-weight: bold; margin-top: 8px; }

  #toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: white;
    padding: 10px 16px; border-radius: 10px;
    display: none; z-index: 9999; font-size: 14px;
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="menu">
  <h3>実車評価支援ツール</h3>

  <label for="githubSelect">GitHubルート選択：</label><br>
  <select id="githubSelect">
    <option value="">（選択してください）</option>
    <option value="https://raw.githubusercontent.com/knovaera-debug/250929_MAP_NAVIGATION_Ver3/main/data/Final_国内DPコース評価ポイント付き_251007_v10.kmz">
      Final_国内DPコース評価ポイント付き_251007_v10.kmz
    </option>
    <option value="https://raw.githubusercontent.com/knovaera-debug/250929_MAP_NAVIGATION_Ver3/main/data/ルートTest.kmz">
      ルートTest.kmz
    </option>
  </select>

  <br><br>
  <button id="startBtn">追跡開始</button>
  <button id="voiceTestBtn">音声テスト</button>
  <button id="closeMenuBtn">メニューを閉じる</button>

  <div id="status">待機中</div>
</div>

<div id="toast"></div>

<script>
let map = L.map('map').setView([35.68,139.76],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

let routeLayer = null;
let pointLayer = null;
let userMarker = null;
let watchId = null;
let currentPoints = [];
let lastAnnounced = false;

// ====== トースト ======
function showToast(msg, duration=2500){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(()=>toast.style.display="none", duration);
}

// ====== 音声案内 ======
function speak(text){
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP";
  utter.pitch = 0.9;
  utter.rate = 0.95;
  utter.volume = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// ====== KMZ読込 ======
async function loadKMZ(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("ファイル取得に失敗");
  const blob = await res.blob();
  const zip = new JSZip();
  const loaded = await zip.loadAsync(blob);
  const kmlFile = Object.keys(loaded.files).find(f=>f.endsWith(".kml"));
  const kmlText = await loaded.files[kmlFile].async("string");
  const parser = new DOMParser();
  const kmlDoc = parser.parseFromString(kmlText,"text/xml");
  const geojson = toGeoJSON.kml(kmlDoc);

  if(routeLayer) map.removeLayer(routeLayer);
  if(pointLayer) map.removeLayer(pointLayer);

  // ルート線
  routeLayer = L.geoJSON(geojson, { color:"orange", weight:4 }).addTo(map);

  // 評価ポイント
  const points = geojson.features.filter(f=>f.geometry.type==="Point");
  currentPoints = points.map(p=>{
    const name = p.properties.name || "ポイント";
    const desc = p.properties.description || ""; // ← メモを取得
    const [lng,lat] = p.geometry.coordinates;
    return { name, desc, lat, lng, notified:false };
  });

  // ポイント表示
  pointLayer = L.layerGroup(currentPoints.map(p=>{
    const html = `
      <div style="
        background:white;
        border:2px solid black;
        border-radius:20px;
        padding:2px 8px;
        color:blue;
        font-weight:bold;
        font-size:13px;
        text-align:center;
        white-space:nowrap;">
        ${p.name}
      </div>`;
    const icon = L.divIcon({ html, className:"", iconAnchor:[20, 20] });
    return L.marker([p.lat,p.lng],{icon});
  })).addTo(map);

  map.fitBounds(routeLayer.getBounds());
  showToast("✅ ルート読込完了");
  speak("ルートを読み込みました");
  document.getElementById("status").textContent = "ルート読込完了";
}

// ====== GitHubルート選択 ======
document.getElementById("githubSelect").addEventListener("change",async function(){
  const url = this.value;
  if(!url) return;
  showToast("GitHubルート読込中...");
  document.getElementById("status").textContent = "ルート読込中...";
  try {
    await loadKMZ(url);
  } catch(e){
    showToast("❌ 読込エラー: "+e.message);
  }
});

// ====== 距離計算 ======
function calcDistance(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+
           Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
           Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ====== 追跡開始 ======
document.getElementById("startBtn").addEventListener("click",()=>{
  if(watchId){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    showToast("追跡停止しました");
    document.getElementById("status").textContent="停止中";
    speak("評価を終了します。お疲れ様でした。");
    return;
  }

  showToast("追跡を開始します");
  speak("評価を開始します。");
  document.getElementById("status").textContent="評価中";

  const notifyDistance=120;
  lastAnnounced=false;

  // 初回位置取得 → 近距離ポイント案内
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;
    const nearby=currentPoints
      .map(p=>({...p,dist:calcDistance(lat,lon,p.lat,p.lng)}))
      .filter(p=>p.dist<=notifyDistance)
      .sort((a,b)=>a.dist-b.dist);
    if(nearby.length>0){
      setTimeout(()=>{
        for(const np of nearby){
          const message = np.desc ? `${np.name}、${np.desc}です` : `${np.name}です`;
          speak(message);
          showToast(`📍 ${np.name}（約${Math.round(np.dist)}m）`);
          np.notified=true;
        }
      },1000);
    }
  });

  // 継続追跡
  watchId=navigator.geolocation.watchPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    if(!userMarker){
      userMarker=L.circleMarker([lat,lon],{
        radius:8,color:"red",fillColor:"#f03",fillOpacity:0.9
      }).addTo(map);
    }else{
      userMarker.setLatLng([lat,lon]);
    }

    let allReached=true;
    for(const p of currentPoints){
      if(!p.notified){
        const dist=calcDistance(lat,lon,p.lat,p.lng);
        if(dist<=notifyDistance){
          const message = p.desc ? `${p.name}、${p.desc}です` : `${p.name}です`;
          speak(message);
          showToast(`📍 ${p.name}（約${Math.round(dist)}m）`);
          p.notified=true;
        }else{
          allReached=false;
        }
      }
    }

    if(!lastAnnounced && allReached && currentPoints.length>0){
      lastAnnounced=true;
      speak("評価を終了します。お疲れ様でした。");
      showToast("✅ 評価を終了しました");
      navigator.geolocation.clearWatch(watchId);
      watchId=null;
      document.getElementById("status").textContent="終了";
    }

  },err=>{
    showToast("GPSエラー: "+err.message);
  },{enableHighAccuracy:true});
});

// ====== 音声テスト ======
document.getElementById("voiceTestBtn").addEventListener("click",()=>{
  speak("音声案内テストです。評価ポイントまでの案内を開始します。");
  showToast("音声テストを再生しました");
});

// ====== メニュー閉じる ======
document.getElementById("closeMenuBtn").addEventListener("click",()=>{
  document.getElementById("menu").style.display="none";
  showToast("メニューを閉じました");
});
</script>
</body>
</html>
