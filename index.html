<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>実車評価支援ツール</title>
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<script src="jszip.min.js"></script>
<script src="togeojson.umd.js"></script>
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; }
#map { width:100%; height:100vh; }
.control-box {
  position:absolute; top:10px; left:10px; z-index:9999;
  background:#fff; padding:10px; border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  width:90%; max-width:400px;
}
button { border:none; border-radius:6px; padding:6px 12px; color:#fff; margin:3px; font-size:15px; }
#startBtn { background-color:#007b3d; }
#currentBtn { background-color:#007bff; }
#menuClose { background-color:gray; }
#voiceTest { background-color:#00994c; }
.toast {
  position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.75); color:#fff; padding:10px 16px;
  border-radius:8px; z-index:10000; animation:fadeInOut 3s;
}
@keyframes fadeInOut {
  0%{opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{opacity:0;}
}
</style>
</head>
<body>
<div class="control-box" id="menuBox">
  <h2>実車評価支援ツール</h2>
  <label>GitHubルート選択：</label>
  <select id="githubRouteSelect"></select><br><br>
  <label>通知半径 (m)：</label>
  <input type="number" id="notifyDistance" value="120" style="width:80px;"> <br><br>
  <button id="startBtn">追跡開始</button>
  <button id="currentBtn">現在地へ</button>
  <button id="voiceTest">音声テスト</button>
  <button id="menuClose">メニューを閉じる</button>
  <p id="status">停止中</p>
</div>
<div id="map"></div>

<script>
// ===== 初期設定 =====
const map = L.map('map').setView([35.4515, 139.3964], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let routeLine = null;
let currentPoints = [];
let userMarker = null;
let watchId = null;
let lastAnnounced = false;

// ===== トースト =====
function showToast(msg){
  const t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

// ===== 音声 =====
function speakAsync(text){
  return new Promise(resolve=>{
    const uttr=new SpeechSynthesisUtterance(text);
    uttr.lang="ja-JP"; uttr.pitch=0.9; uttr.rate=0.95; uttr.volume=1.0;
    uttr.onend=resolve;
    speechSynthesis.cancel();
    speechSynthesis.speak(uttr);
  });
}

// ===== 距離計算 =====
function calcDistance(lat1, lon1, lat2, lon2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ===== ルート選択 =====
const routes=[
  "data/ルートTest.kmz",
  "data/Final_国内DPコース評価ポイント付き_251007_v10.kmz"
];
const sel=document.getElementById("githubRouteSelect");
routes.forEach(p=>{
  const o=document.createElement("option");
  o.value=p; o.textContent=p.split("/").pop();
  sel.appendChild(o);
});

// ===== KMZロード =====
async function loadKmzFromGithub(url){
  showToast("ルート読込中...");
  const res=await fetch(url);
  const blob=await res.blob();
  const zip=await JSZip.loadAsync(blob);
  const kmlFile=Object.keys(zip.files).find(k=>k.endsWith(".kml"));
  const kmlText=await zip.file(kmlFile).async("string");
  const kmlDom=new DOMParser().parseFromString(kmlText,"text/xml");
  const geojson=toGeoJSON.kml(kmlDom);

  if(routeLine){ map.removeLayer(routeLine); }
  currentPoints.forEach(p=>map.removeLayer(p.marker));
  currentPoints=[];

  geojson.features.forEach(f=>{
    if(f.geometry.type==="LineString"){
      routeLine=L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]),{color:"orange",weight:5}).addTo(map);
    }else if(f.geometry.type==="Point"){
      const [lon,lat]=f.geometry.coordinates;
      const name=f.properties.name||"";
      const desc=f.properties.description||"";
      const m=L.circleMarker([lat,lon],{radius:8,color:"black",fillColor:"blue",fillOpacity:0.9}).addTo(map);
      currentPoints.push({lat,lng:lon,name,desc,marker:m,notified:false});
    }
  });
  if(routeLine){ map.fitBounds(routeLine.getBounds()); }
  showToast("ルート読込完了");
}
loadKmzFromGithub(sel.value);
sel.addEventListener("change",()=>loadKmzFromGithub(sel.value));

// ===== 音声テスト =====
document.getElementById("voiceTest").addEventListener("click",()=>{
  speakAsync("音声案内のテストです。");
});

// ===== メニュー閉じる =====
document.getElementById("menuClose").addEventListener("click",()=>{
  document.getElementById("menuBox").style.display="none";
  showToast("メニューを閉じました");
});

// ===== 現在地へ =====
document.getElementById("currentBtn").addEventListener("click",()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    map.setView([p.coords.latitude,p.coords.longitude],17);
  });
});

// ===== 追跡開始 =====
document.getElementById("startBtn").addEventListener("click",async()=>{
  if(watchId){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    document.getElementById("status").textContent="停止中";
    await speakAsync("評価を終了します。お疲れ様でした。");
    showToast("追跡停止しました");
    return;
  }

  const notifyDistance=parseFloat(document.getElementById("notifyDistance").value)||120;
  await speakAsync("評価を開始します。");
  document.getElementById("status").textContent="評価中";
  showToast("追跡を開始します");
  lastAnnounced=false;

  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    const nearby=currentPoints
      .map(p=>({...p,dist:calcDistance(lat,lon,p.lat,p.lng)}))
      .filter(p=>p.dist<=notifyDistance)
      .sort((a,b)=>a.dist-b.dist);
    for(const np of nearby){
      const idx=currentPoints.findIndex(x=>x.lat===np.lat&&x.lng===np.lng);
      if(idx>=0 && !currentPoints[idx].notified){
        const msg=np.desc?`${np.name}、${np.desc}です`:`${np.name}です`;
        await speakAsync(msg);
        showToast(`📍${np.name}（約${Math.round(np.dist)}m）`);
        currentPoints[idx].notified=true; // ← 実体更新
      }
    }
  });

  // ===== 位置監視 =====
  watchId=navigator.geolocation.watchPosition(async pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;

    if(!userMarker){
      userMarker=L.circleMarker([lat,lon],{radius:8,color:"red",fillColor:"#f03",fillOpacity:0.9}).addTo(map);
    }else userMarker.setLatLng([lat,lon]);

    let allReached=true;
    for(const p of currentPoints){
      if(!p.notified){
        const dist=calcDistance(lat,lon,p.lat,p.lng);
        if(dist<=notifyDistance){
          const msg=p.desc?`${p.name}、${p.desc}です`:`${p.name}です`;
          await speakAsync(msg);
          showToast(`📍${p.name}（約${Math.round(dist)}m）`);
          p.notified=true; // 一度発話したら絶対に再通知しない
        }else{
          allReached=false;
        }
      }
    }

    // 全ポイント完了時
    if(!lastAnnounced && allReached && currentPoints.length>0){
      lastAnnounced=true;
      await speakAsync("評価を終了します。お疲れ様でした。");
      showToast("✅ 評価を終了しました");
      navigator.geolocation.clearWatch(watchId);
      watchId=null;
      document.getElementById("status").textContent="終了";
    }
  },err=>showToast("GPSエラー:"+err.message),{enableHighAccuracy:true});
});
</script>
</body>
</html>
