<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>実車評価支援ツール</title>
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }

    /* コントロールボックス */
    .control-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      width: 320px;
      font-size: 14px;
      transition: opacity 0.3s ease;
    }
    .control-box.hidden {
      opacity: 0.2;
    }
    .control-box:hover {
      opacity: 1.0;
    }
    .control-box h2 {
      margin: 5px 0 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .btn {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    #startBtn { background: #22c55e; }
    #nowBtn { background: #3b82f6; }
    #pointBtn { background: #f59e0b; }
    #voiceTestBtn { background: #6366f1; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-box" id="menuBox">
    <h2>実車評価支援ツール</h2>
    <div>
      評価コース：
      <select id="courseSelect"></select>
    </div>

    <div style="margin-top: 8px;">
      <button id="startBtn" class="btn" onclick="startTracking()">追跡開始</button>
      <button id="nowBtn" class="btn" onclick="goToCurrent()">現在地へ</button>
      <button id="pointBtn" class="btn" onclick="showCheckpoints()">チェックポイント</button>
      <button id="voiceTestBtn" class="btn" onclick="voiceTest()">音声テスト</button>
    </div>

    <div style="margin-top: 8px;">
      <label><input type="checkbox" id="keepCenter" checked> 自車を常に中心</label><br />
      向き：
      <label><input type="radio" name="headingMode" value="north" checked> 北を上</label>
      <label><input type="radio" name="headingMode" value="track"> 進行方向を上</label>
    </div>

    <hr>
    <div>
      <label><input type="checkbox" id="voiceGuide" checked> 音声案内ON</label><br>
      案内距離(m)：<input type="number" id="voiceDistance" value="120" style="width:60px;">
    </div>
  </div>

  <script src="leaflet.js"></script>
  <script src="jszip.min.js"></script>
  <script src="togeojson.umd.js"></script>

  <script>
    let map, trackMarker, routeLayer, pointLayer, watchId;
    let kyokoVoice = null;
    let firstPositionHandled = false;
    let announcedPoints = new Map();
    const REPEAT_BLOCK_MS = 180000;

    // --- 音声関連 ---
    function initVoice() {
      const voices = speechSynthesis.getVoices();
      kyokoVoice = voices.find(v => v.name.includes("Kyoko")) || voices.find(v => v.lang === "ja-JP");
      if (!kyokoVoice) {
        // Safariでは非同期ロード
        speechSynthesis.onvoiceschanged = () => {
          kyokoVoice = speechSynthesis.getVoices().find(v => v.name.includes("Kyoko")) || null;
        };
      }
    }

    function speak(text) {
      if (!kyokoVoice || !text) {
        console.warn("音声が初期化されていません");
        return;
      }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = kyokoVoice;
      u.lang = "ja-JP";
      u.pitch = 0.65;
      u.rate = 0.9;
      u.volume = 1.0;
      speechSynthesis.speak(u);
    }

    // --- 地図初期化 ---
    window.onload = async function() {
      map = L.map("map").setView([35.4, 139.4], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      initVoice();

      try {
        const res = await fetch("data/filelist.json");
        const files = await res.json();
        const sel = document.getElementById("courseSelect");
        files.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          opt.textContent = f;
          sel.appendChild(opt);
        });
        sel.addEventListener("change", () => loadKMZ(sel.value));
        if (files.length > 0) loadKMZ(files[0]);
      } catch (e) {
        console.error("filelist.json取得失敗", e);
      }

      // UIをタップで一時的に薄く
      const menu = document.getElementById("menuBox");
      let hideTimer;
      map.on("click", () => {
        menu.classList.add("hidden");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => menu.classList.remove("hidden"), 5000);
      });
    };

    // --- KMZ読込 ---
    async function loadKMZ(filename) {
      if (!filename) return;
      if (routeLayer) map.removeLayer(routeLayer);
      if (pointLayer) map.removeLayer(pointLayer);

      const res = await fetch(`data/${filename}`);
      const blob = await res.blob();
      const zip = await JSZip.loadAsync(blob);
      const kmlFile = Object.keys(zip.files).find(n => n.endsWith(".kml"));
      const kmlText = await zip.file(kmlFile).async("text");
      const kml = new DOMParser().parseFromString(kmlText, "text/xml");
      const geojson = toGeoJSON.kml(kml);

      // 分離：ライン（オレンジ）／ポイント（青）
      const lines = geojson.features.filter(f => f.geometry.type.includes("Line"));
      const points = geojson.features.filter(f => f.geometry.type === "Point");

      routeLayer = L.geoJSON({ type: "FeatureCollection", features: lines }, {
        style: { color: "orange", weight: 5, opacity: 0.8 }
      }).addTo(map);

      pointLayer = L.geoJSON({ type: "FeatureCollection", features: points }, {
        pointToLayer: (f, latlng) => L.circleMarker(latlng, {
          radius: 6,
          color: "blue",
          weight: 2,
          fillColor: "#3399ff",
          fillOpacity: 0.8
        }),
        onEachFeature: (f, layer) => {
          if (f.properties?.name) layer.bindPopup(f.properties.name);
        }
      }).addTo(map);

      map.fitBounds(routeLayer.getBounds());
      announcedPoints.clear();
      firstPositionHandled = false;
    }

    // --- 追跡開始 ---
    function startTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      if (!navigator.geolocation) {
        alert("GPS非対応です");
        return;
      }

      speak("追跡を開始しました。");
      watchId = navigator.geolocation.watchPosition(
        pos => updatePosition(pos.coords.latitude, pos.coords.longitude),
        err => console.error("GPS取得失敗", err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // --- 現在位置更新 ---
    function updatePosition(lat, lng) {
      const latlng = [lat, lng];

      if (!trackMarker) {
        // 自車位置＝赤丸
        trackMarker = L.circleMarker(latlng, {
          radius: 8,
          color: "red",
          fillColor: "#ff3333",
          fillOpacity: 0.9,
          weight: 2
        }).addTo(map);
      } else {
        trackMarker.setLatLng(latlng);
      }

      const keepCenter = document.getElementById("keepCenter").checked;
      if (keepCenter) map.panTo(latlng);

      if (!firstPositionHandled) {
        firstPositionHandled = true;
        const nearest = findNearestPoint(lat, lng);
        if (nearest) speak(`まもなく ${nearest.name} です。`);
      }

      checkNearbyPoints(lat, lng);
    }

    // --- 近距離ポイント案内 ---
    function findNearestPoint(lat, lng) {
      if (!pointLayer) return null;
      let minDist = Infinity, nearest = null;
      pointLayer.eachLayer(l => {
        const d = map.distance([lat, lng], l.getLatLng());
        if (d < minDist) {
          minDist = d;
          nearest = { name: l.feature.properties.name, dist: d };
        }
      });
      return nearest;
    }

    function checkNearbyPoints(lat, lng) {
      if (!pointLayer) return;
      const voiceDist = parseFloat(document.getElementById("voiceDistance").value);
      if (!document.getElementById("voiceGuide").checked) return;

      pointLayer.eachLayer(l => {
        const d = map.distance([lat, lng], l.getLatLng());
        if (d <= voiceDist) {
          const name = l.feature.properties.name;
          const last = announcedPoints.get(name);
          const now = Date.now();
          if (!last || now - last > REPEAT_BLOCK_MS) {
            announcedPoints.set(name, now);
            speak(`まもなく ${name} です。`);
          }
        }
      });
    }

    function goToCurrent() {
      if (trackMarker) map.panTo(trackMarker.getLatLng());
    }

    function showCheckpoints() {
      if (!pointLayer) return;
      const names = [];
      pointLayer.eachLayer(l => names.push(l.feature.properties.name));
      alert("チェックポイント:\n" + names.join("\n"));
    }

    function voiceTest() {
      initVoice();
      setTimeout(() => speak("音声テストです。抑揚をつけずに話します。"), 500);
    }
  </script>
</body>
</html>
