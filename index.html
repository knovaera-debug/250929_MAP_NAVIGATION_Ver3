<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>実車評価支援ツール</title>
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }

    .control-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      width: 320px;
      font-size: 14px;
    }
    .control-box h2 {
      margin: 5px 0 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .btn {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    #startBtn { background: #22c55e; }
    #nowBtn { background: #3b82f6; }
    #pointBtn { background: #f59e0b; }
    #voiceTestBtn { background: #6366f1; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-box">
    <h2>実車評価支援ツール</h2>
    <div>
      評価コース：
      <select id="courseSelect"></select>
    </div>

    <div style="margin-top: 8px;">
      <button id="startBtn" class="btn" onclick="startTracking(event)">追跡開始</button>
      <button id="nowBtn" class="btn" onclick="goToCurrent()">現在地へ</button>
      <button id="pointBtn" class="btn" onclick="showCheckpoints()">チェックポイント</button>
      <button id="voiceTestBtn" class="btn" onclick="voiceTest()">音声テスト</button>
    </div>

    <div style="margin-top: 8px;">
      <label><input type="checkbox" id="keepCenter" checked> 自車を常に中心</label><br />
      向き：
      <label><input type="radio" name="headingMode" value="north" checked> 北を上</label>
      <label><input type="radio" name="headingMode" value="track"> 進行方向を上</label>
    </div>

    <hr>
    <div>
      <label><input type="checkbox" id="voiceGuide" checked> 音声案内ON</label><br>
      案内距離(m)：<input type="number" id="voiceDistance" value="120" style="width:60px;">
    </div>
  </div>

  <script src="leaflet.js"></script>
  <script src="jszip.min.js"></script>
  <script src="togeojson.umd.js"></script>

  <script>
    let map, trackMarker, pointLayer, watchId;
    let kyokoVoice = null;
    let announcedPoints = new Map();
    let firstPositionHandled = false;
    let headingMode = "north";
    const REPEAT_BLOCK_MS = 180000;

    // --- 音声制御キュー ---
    let isSpeaking = false;
    let speakQueue = [];

    function speakQueued(text) {
      if (!kyokoVoice || !text) return;
      speakQueue.push(text);
      if (!isSpeaking) processQueue();
    }

    function processQueue() {
      if (speakQueue.length === 0) { isSpeaking = false; return; }
      isSpeaking = true;
      const text = speakQueue.shift();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = kyokoVoice;
      u.lang = "ja-JP";
      u.rate = 0.9;    // ゆっくり
      u.pitch = 0.65;  // 抑揚を抑える
      u.volume = 1.0;
      u.onend = () => { isSpeaking = false; processQueue(); };
      speechSynthesis.speak(u);
    }

    // --- 地図初期化 ---
    window.onload = async function() {
      map = L.map("map").setView([35.4, 139.4], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // 音声初期化
      speechSynthesis.onvoiceschanged = () => {
        kyokoVoice = speechSynthesis.getVoices().find(v => v.name.includes("Kyoko")) || null;
      };

      // コース読込
      try {
        const res = await fetch("data/filelist.json");
        const files = await res.json();
        const sel = document.getElementById("courseSelect");
        files.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          opt.textContent = f;
          sel.appendChild(opt);
        });
        sel.addEventListener("change", () => loadKMZ(sel.value));
        if (files.length > 0) loadKMZ(files[0]);
      } catch (e) {
        console.error("ファイルリストの取得に失敗:", e);
      }

      document.querySelectorAll("input[name='headingMode']").forEach(r => {
        r.addEventListener("change", e => headingMode = e.target.value);
      });
    };

    // --- KMZ 読み込み ---
    async function loadKMZ(filename) {
      if (!filename) return;
      if (pointLayer) map.removeLayer(pointLayer);

      const res = await fetch(`data/${filename}`);
      const blob = await res.blob();
      const zip = await JSZip.loadAsync(blob);
      const kmlFile = Object.keys(zip.files).find(name => name.endsWith(".kml"));
      const kmlText = await zip.file(kmlFile).async("text");
      const kml = new DOMParser().parseFromString(kmlText, "text/xml");
      const geojson = toGeoJSON.kml(kml);

      pointLayer = L.geoJSON(geojson, {
        pointToLayer: (f, latlng) => L.circleMarker(latlng, {
          radius: 7, color: "black", weight: 2, fillColor: "red", fillOpacity: 0.8
        }),
        onEachFeature: (f, layer) => {
          if (f.properties && f.properties.name) layer.bindPopup(f.properties.name);
        }
      }).addTo(map);

      map.fitBounds(pointLayer.getBounds());
      announcedPoints.clear();
      firstPositionHandled = false;
    }

    // --- 追跡開始 ---
    function startTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      if (!navigator.geolocation) {
        alert("GPSが利用できません");
        return;
      }

      speakQueued("追跡を開始しました。");
      watchId = navigator.geolocation.watchPosition(
        pos => updatePosition(pos.coords.latitude, pos.coords.longitude),
        err => console.error(err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // --- 現在位置更新 ---
    function updatePosition(lat, lng) {
      const latlng = [lat, lng];
      if (!trackMarker) {
        trackMarker = L.marker(latlng, { icon: L.icon({
          iconUrl: "https://cdn-icons-png.flaticon.com/512/854/854894.png",
          iconSize: [30,30], iconAnchor: [15,15]
        })}).addTo(map);
      } else {
        trackMarker.setLatLng(latlng);
      }

      const keepCenter = document.getElementById("keepCenter").checked;
      if (keepCenter) map.panTo(latlng);

      if (!firstPositionHandled) {
        firstPositionHandled = true;
        const nearest = findNearestPoint(lat, lng);
        if (nearest) {
          speakQueued(`まもなく ${nearest.name} です。`);
        }
      }

      checkNearbyPoints(lat, lng);
    }

    // --- 最寄りポイント判定 ---
    function findNearestPoint(lat, lng) {
      if (!pointLayer) return null;
      let minDist = Infinity, nearest = null;
      pointLayer.eachLayer(layer => {
        const p = layer.getLatLng();
        const d = map.distance([lat, lng], p);
        if (d < minDist) {
          minDist = d;
          nearest = { name: layer.feature.properties.name, dist: d };
        }
      });
      return nearest;
    }

    // --- 近距離案内 ---
    function checkNearbyPoints(lat, lng) {
      if (!pointLayer) return;
      const voiceDist = parseFloat(document.getElementById("voiceDistance").value);
      const guideOn = document.getElementById("voiceGuide").checked;
      if (!guideOn) return;

      pointLayer.eachLayer(layer => {
        const p = layer.getLatLng();
        const d = map.distance([lat, lng], p);
        if (d <= voiceDist) {
          const name = layer.feature.properties.name;
          const last = announcedPoints.get(name);
          const now = Date.now();
          if (!last || now - last > REPEAT_BLOCK_MS) {
            announcedPoints.set(name, now);
            speakQueued(`まもなく ${name} です。`);
          }
        }
      });
    }

    // --- 現在地へ ---
    function goToCurrent() {
      if (trackMarker) map.panTo(trackMarker.getLatLng());
    }

    // --- チェックポイント一覧 ---
    function showCheckpoints() {
      if (!pointLayer) return;
      let list = [];
      pointLayer.eachLayer(l => list.push(l.feature.properties.name));
      alert("チェックポイント:\n" + list.join("\n"));
    }

    // --- 音声テスト ---
    function voiceTest() {
      speakQueued("音声テストです。抑揚をつけずに、はっきり話します。");
    }
  </script>
</body>
</html>
