<!-- === トースト付き追跡制御 === -->
<script>
function showToast(message) {
  const toast = document.createElement("div");
  toast.textContent = message;
  toast.style.position = "fixed";
  toast.style.top = "50%";
  toast.style.left = "50%";
  toast.style.transform = "translate(-50%, -50%)";
  toast.style.background = "rgba(0, 0, 0, 0.8)";
  toast.style.color = "#fff";
  toast.style.padding = "20px 30px";
  toast.style.borderRadius = "25px";
  toast.style.fontSize = "1.2rem";
  toast.style.fontWeight = "bold";
  toast.style.boxShadow = "0 0 10px rgba(0,0,0,0.3)";
  toast.style.zIndex = "9999";
  toast.style.opacity = "0";
  toast.style.transition = "opacity 0.5s ease";
  document.body.appendChild(toast);

  // フェードイン
  requestAnimationFrame(() => { toast.style.opacity = "1"; });

  // 自動フェードアウト
  setTimeout(() => {
    toast.style.opacity = "0";
    setTimeout(() => toast.remove(), 500);
  }, 2500);
}

function startTracking() {
  const btn = event.target;

  // 停止状態なら開始
  if (!watchId) {
    if (!navigator.geolocation) {
      alert("GPS未対応ブラウザです");
      return;
    }

    // 🔊 音声＋中央トーストで開始を明確化
    const utter = new SpeechSynthesisUtterance("評価を開始します。");
    utter.lang = "ja-JP";
    if (kyokoVoice) utter.voice = kyokoVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);

    showToast("📡 追跡を開始しました");
    btn.textContent = "追跡停止";
    btn.style.background = "#ef4444"; // 赤

    gpsInitialized = true;

    watchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const heading = pos.coords.heading;
        const latlng = [lat, lng];

        // 自車マーカー更新
        if (!trackMarker) {
          trackMarker = L.marker(latlng, { icon: carIcon, title: "現在地" }).addTo(map);
        } else {
          trackMarker.setLatLng(latlng);
        }

        // 向きと追従
        if (heading !== null && !isNaN(heading)) {
          const carElem = document.getElementById("carMarker");
          if (carElem) carElem.style.transform = `rotate(${heading}deg)`;
          if (headingMode === "track") map.setBearing?.(heading);
        }
        if (keepCentered) map.setView(latlng);

        // 音声案内
        const voiceEnabled = document.getElementById("voiceGuide").checked;
        const distanceThreshold = parseInt(document.getElementById("voiceDistance").value) || 120;
        const now = Date.now();

        if (voiceEnabled && pointLayer) {
          pointLayer.eachLayer(layer => {
            const dist = map.distance(latlng, layer.getLatLng());
            const lastAnnounced = announcedPoints.get(layer._leaflet_id);
            if (dist < distanceThreshold && (!lastAnnounced || now - lastAnnounced > 180000)) {
              const name = layer.feature?.properties?.name || "チェックポイント";
              const utter = new SpeechSynthesisUtterance(`まもなく ${name}`);
              utter.lang = "ja-JP";
              if (kyokoVoice) utter.voice = kyokoVoice;
              speechSynthesis.cancel();
              speechSynthesis.speak(utter);
              announcedPoints.set(layer._leaflet_id, now);
            }
          });
        }
      },
      err => alert("位置情報エラー: " + err.message),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );

  // 追跡停止
  } else {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    btn.textContent = "追跡開始";
    btn.style.background = "#22c55e"; // 緑
    showToast("⏹ 追跡を停止しました");

    const utter = new SpeechSynthesisUtterance("評価を終了します。");
    utter.lang = "ja-JP";
    if (kyokoVoice) utter.voice = kyokoVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }
}
</script>
